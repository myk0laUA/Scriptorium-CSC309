services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must identify a tested release}
    restart: unless-stopped
    env_file:
      - /etc/scriptorium/app.env
      - /etc/scriptorium/oauth.env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "false"
      NEXTAUTH_URL: https://scriptorium-myk.duckdns.org
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [appnet]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  appnet:
    external: true
    name: scriptorium-csc309_appnet
